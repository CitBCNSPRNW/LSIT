<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSIT | ระบบติดตามและประเมินผลการพัฒนาบริการห้องสมุด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sarabun', sans-serif; box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }
    #preloader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, #e0f2fe 0%, transparent 45%),
                  radial-gradient(circle at 80% 80%, #fce7f3 0%, transparent 45%),
                  #f8fafc;
      z-index: 10;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(14, 165, 233, 0.12);
      border: 1px solid #e2e8f0;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #0ea5e9;
      box-shadow: 0 0 0 6px rgba(236, 72, 153, 0.12);
      margin-bottom: 0.75rem;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3.5px solid #e0f2fe;
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    #app-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="card">
      <img class="logo" src="https://lh5.googleusercontent.com/d/1tDVKF6qFEl7_avxewudlClYsk9qkrgop" alt="BCNSPRNW Logo">
      <h2 style="margin:0 0 0.25rem; color:#0284c7;">LSIT</h2>
      <p style="margin:0 0 0.35rem; font-size:0.95rem; color:#475569;">ระบบติดตามและประเมินผลการพัฒนาบริการห้องสมุด</p>
      <p style="margin:0; font-size:0.8rem; color:#64748b;">งานห้องสมุด วิทยาลัยพยาบาลบรมราชชนนี สวรรค์ประชารักษ์ นครสวรรค์</p>
      <div class="spinner"></div>
      <p style="margin:0; font-size:0.85rem; color:#64748b;">กำลังโหลดระบบ...</p>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbzVramYCMe1WIi6N1MtUSsCBm9cZ_JxCFuuGdnxwUH1T2KFcx2AswSR2bAvhUL7B3v7/exec" target="_top">เปิดลิงก์ตรง (กรณีหน้าจอไม่แสดงผล)</a>
    </div>
  </div>

  <iframe id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzVramYCMe1WIi6N1MtUSsCBm9cZ_JxCFuuGdnxwUH1T2KFcx2AswSR2bAvhUL7B3v7/exec"
    allow="clipboard-write"
    onload="document.getElementById('preloader').style.display='none';">
  </iframe>
</body>
</html>
